[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peptidescan"
version = "0.1.0"
description = "A Python package for peptide sequence analysis and filtering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython",
    "pyteomics",
    "pandas"
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]